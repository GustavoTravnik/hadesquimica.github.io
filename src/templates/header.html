  <header class="cabecalho">
    <div class="container cabecalho__interno">
      <a class="logo" href="{{raiz}}">
        <img class="logo__img" src="{{raiz}}assets/img/logo.jpg" alt="{{logoAlt}}" width="180" height="60" decoding="async">
        <span class="logo__texto">{{nomeEmpresa}}</span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="menu-principal" aria-label="Menu">
        <span class="nav-toggle__barras" aria-hidden="true"></span>
      </button>
      <nav id="menu-principal" class="nav" aria-label="Principal">
        <ul class="nav__lista">
{{{menu}}}
        </ul>
      </nav>
      {{{cta}}}
    </div>
  </header>
